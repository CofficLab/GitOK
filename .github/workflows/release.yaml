name: Release

on:
  workflow_run:
    workflows:
      - "Bump"
    types:
      - completed

permissions:
  contents: write
  actions: read

env:
  SCHEME: GitOK
  DESTINATION: generic/platform=macOS
  ENTITLEMENTS_PATH: GitOKApp/App.entitlements
  DERIVED_DATA_PATH: ./DerivedData
  RELEASE_ARCHS: arm64 x86_64
  SPARKLE_VERSION: "2.8.1"
  R2_API_URL: https://data.coffic.cn
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
  BUILD_CERTIFICATE_P12_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_P12_PASSWORD }}
  APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
  APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
  APP_STORE_CONNECT_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ISSUER_ID }}

jobs:
  build_with_signing:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: 获取 Bump 产出的 commit
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: .release-metadata
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Checkout 发布 commit
        run: |
          set -euo pipefail
          release_sha="$(cat .release-metadata/release-commit.txt)"
          git rev-parse --verify "${release_sha}^{commit}" >/dev/null
          git checkout --detach "$release_sha"
          echo "发布 commit: $(git rev-parse HEAD)"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: 获取最新 tag
        run: |
          tag=$(git describe --tags --abbrev=0)
          echo "TAG=$tag" >> "$GITHUB_ENV"
          if [[ $tag == p* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
            previous_tag=$(git tag -l "p[0-9]*" | sort -V | grep -Fxv "$tag" | tail -n 1)
            if [ -z "$previous_tag" ]; then
              previous_tag=$(git tag -l "v*" | sort -V | tail -n 1)
            fi
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
            previous_tag=$(git tag -l "v*" | sort -V | grep -Fxv "$tag" | tail -n 1)
          fi
          echo "PREVIOUS_TAG=$previous_tag" >> "$GITHUB_ENV"

      - name: Setup macOS signing
        id: signing
        run: |
          chmod +x .github/scripts/setup-macos-signing.sh
          source ./.github/scripts/setup-macos-signing.sh
          echo "signing_identity=$SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"
          echo "api_key_path=$API_KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Resolve SPM Dependencies
        run: |
          set -euo pipefail
          rm -rf "${{ env.DERIVED_DATA_PATH }}/SourcePackages"
          mkdir -p "${{ env.DERIVED_DATA_PATH }}/SourcePackages"
          xcodebuild -project "${{ env.SCHEME }}.xcodeproj" \
            -scheme "${{ env.SCHEME }}" \
            -derivedDataPath "${{ env.DERIVED_DATA_PATH }}" \
            -resolvePackageDependencies \
            -skipPackagePluginValidation

      - name: Build App (Archive)
        run: |
          set -euo pipefail
          mkdir -p ./temp
          for arch in ${{ env.RELEASE_ARCHS }}; do
            archive_path="./temp/${{ env.SCHEME }}-${arch}.xcarchive"
            archive_log="./temp/archive-${arch}.log"
            rm -rf "$archive_path"

            set +e
            xcodebuild archive \
              -project "${{ env.SCHEME }}.xcodeproj" \
              -scheme "${{ env.SCHEME }}" \
              -destination "${{ env.DESTINATION }}" \
              -derivedDataPath "${{ env.DERIVED_DATA_PATH }}" \
              -archivePath "$archive_path" \
              -configuration Release \
              -skipPackagePluginValidation \
              -skipPackageSignatureValidation \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="-" \
              DEVELOPMENT_TEAM="${{ steps.signing.outputs.team_id }}" \
              CODE_SIGN_ENTITLEMENTS="" \
              CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
              PROVISIONING_PROFILE_SPECIFIER="" \
              CODE_SIGNING_REQUIRED=NO \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              ARCHS="$arch" \
              ONLY_ACTIVE_ARCH=NO > "$archive_log" 2>&1
            archive_exit=$?
            set -e

            if [ "$archive_exit" -ne 0 ]; then
              echo "❌ Archive failed for $arch (exit $archive_exit)"
              tail -200 "$archive_log" || true
              echo "--- error lines ---"
              grep -E "(error:|FAILED|BUILD FAILED|No profiles|Cannot find)" "$archive_log" | head -60 || true
              exit 1
            fi

            echo "✅ Archive succeeded for $arch"
          done

      - name: Codesign App
        run: |
          set -euo pipefail
          identity="${{ steps.signing.outputs.signing_identity }}"
          chmod +x .github/scripts/sign_app.sh

          for arch in ${{ env.RELEASE_ARCHS }}; do
            archive_app="./temp/${{ env.SCHEME }}-${arch}.xcarchive/Products/Applications/${{ env.SCHEME }}.app"
            app_path="./temp/${{ env.SCHEME }}-${arch}.app"

            if [ ! -d "$archive_app" ]; then
              echo "❌ Archived app not found: $archive_app"
              exit 1
            fi

            rm -rf "$app_path"
            ditto "$archive_app" "$app_path"
            binary_path="$app_path/Contents/MacOS/${{ env.SCHEME }}"
            if ! lipo -archs "$binary_path" | tr ' ' '\n' | grep -qx "$arch"; then
              echo "❌ $binary_path does not contain expected architecture: $arch"
              lipo -archs "$binary_path" || true
              exit 1
            fi

            .github/scripts/sign_app.sh "$app_path" "$identity" "${{ env.ENTITLEMENTS_PATH }}"
          done

      - name: Create DMG
        run: |
          set -euo pipefail
          for arch in ${{ env.RELEASE_ARCHS }}; do
            staging_dir="./temp/dmg_staging_${arch}"
            volume_name="${{ env.SCHEME }}-${arch}"
            app_path="./temp/${{ env.SCHEME }}-${arch}.app"
            version_dmg=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Contents/Info.plist" | tr . _)
            dmg_name="./temp/${{ env.SCHEME }}_${version_dmg}_${arch}.dmg"

            if [ ! -d "$app_path" ]; then
              echo "❌ Signed app not found: $app_path"
              exit 1
            fi

            rm -rf "$staging_dir"
            mkdir -p "$staging_dir"
            ditto "$app_path" "$staging_dir/${{ env.SCHEME }}.app"
            ln -sfn /Applications "$staging_dir/Applications"
            mdutil -i off "$staging_dir" 2>/dev/null || true
            mdutil -i off ./temp 2>/dev/null || true
            sync
            sleep 1

            create_dmg() {
              hdiutil detach "/Volumes/${volume_name}" -force 2>/dev/null || true
              rm -f "$dmg_name"
              hdiutil create -volname "$volume_name" -srcfolder "$staging_dir" -ov -format UDZO "$dmg_name"
            }

            attempt=0
            until create_dmg; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 6 ]; then
                echo "❌ hdiutil create failed after 6 attempts for $arch"
                exit 1
              fi
              echo "⚠️ hdiutil failed for $arch (attempt $attempt/6), retrying..."
              sleep $((attempt * 3))
            done

            rm -rf "$staging_dir"
            echo "✅ Created: $dmg_name"
          done
          ls -alh ./temp/*.dmg

      - name: Notarize DMG
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in ./temp/*.dmg; do
            echo "🔐 Notarizing $file"
            result_file="notary_result_$(basename "$file" .dmg).txt"
            set +e
            xcrun notarytool submit "$file" \
              --key "${{ steps.signing.outputs.api_key_path }}" \
              --key-id="${APP_STORE_CONNECT_KEY_ID}" \
              --issuer "${APP_STORE_CONNECT_KEY_ISSUER_ID}" \
              --wait \
              --timeout 10m > "$result_file" 2>&1
            notarize_exit=$?
            set -e
            cat "$result_file"

            if [ "$notarize_exit" -ne 0 ] || grep -q "status: Invalid" "$result_file"; then
              echo "❌ Notarization failed for $file"
              submission_id=$(grep "id:" "$result_file" | sed -n '1p' | awk '{print $2}' | tr -d ' ')
              if [ -n "$submission_id" ]; then
                xcrun notarytool log "$submission_id" \
                  --key "${{ steps.signing.outputs.api_key_path }}" \
                  --key-id="${APP_STORE_CONNECT_KEY_ID}" \
                  --issuer "${APP_STORE_CONNECT_KEY_ISSUER_ID}" || true
              fi
              exit 1
            fi

            stapler staple "$file"
          done

      - name: Validate Notarization
        run: |
          set -euo pipefail
          for file in ./temp/*.dmg; do
            stapler validate "$file"
          done

      - name: Prepare updates
        run: |
          mkdir -p updates
          cp ./temp/*.dmg updates/
          ls -alh updates

      - name: Generate Changelog
        run: |
          if [ -z "${PREVIOUS_TAG:-}" ]; then
            NOTES="## Release ${TAG}\n\nInitial release"
          else
            CHANGES=$(git log "${PREVIOUS_TAG}"..HEAD --no-merges --pretty=format:'- %s' \
              | grep -Ev '^- (ci|chore|build|style|test)(\(|:)' \
              | grep -Ev '^- ci:' \
              | sort -u \
              | head -20)
            if [ -z "$CHANGES" ]; then
              CHANGES="- Maintenance and stability improvements"
            fi
            NOTES="## Release ${TAG}\n\n### Changes since ${PREVIOUS_TAG}\n\n${CHANGES}"
          fi
          echo -e "$NOTES" > changelog.md
          cat changelog.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate appcasts
        if: env.IS_PRERELEASE == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SPARKLE_BIN="$(SPARKLE_VERSION="${SPARKLE_VERSION}" .github/scripts/install-sparkle-tools.sh)"
          RELEASE_NOTES_HTML=$(gh api markdown -F text=@changelog.md -f mode=gfm)
          RELEASE_NOTES_LINK="https://github.com/CofficLab/GitOK/releases/latest"

          for arch in arm64 x86_64; do
            input_dir="appcast_input_${arch}"
            appcast_file="appcast-${arch}.xml"
            rm -rf "$input_dir"
            mkdir -p "$input_dir"
            cp ./updates/*"${arch}"*.dmg "$input_dir/"

            echo "🔑 Generating appcast for $arch..."
            echo "${{ secrets.SPARKLE_PRIVATE_KEY_GITOK }}" | \
              "${SPARKLE_BIN}/generate_appcast" --ed-key-file - "$input_dir"

            if [ ! -f "$input_dir/appcast.xml" ]; then
              echo "❌ generate_appcast did not produce appcast.xml for $arch"
              ls -la "$input_dir"
              exit 1
            fi

            cp "$input_dir/appcast.xml" "$appcast_file"
            dmg_file=$(basename "$(ls "$input_dir"/*.dmg | head -n 1)")
            export u="https://github.com/CofficLab/GitOK/releases/latest/download/$dmg_file"
            export RELEASE_NOTES_HTML
            export RELEASE_NOTES_LINK

            perl -i -pe 'if (!$done) { s/(enclosure url=")[^"]*/$1.$ENV{u}/e && ($done=1) }' "$appcast_file"
            perl -i -0777 -pe '
              if (!$done++) {
                my $notes = $ENV{RELEASE_NOTES_HTML} // "";
                my $link = $ENV{RELEASE_NOTES_LINK} // "";
                my $insert = qq{\n            <description><![CDATA[$notes]]></description>\n            <sparkle:fullReleaseNotesLink>$link</sparkle:fullReleaseNotesLink>};
                s/(<sparkle:minimumSystemVersion>[^<]+<\/sparkle:minimumSystemVersion>)(?!\s*<description)/$1$insert/s;
              }
            ' "$appcast_file"
          done

          cp appcast-arm64.xml appcast.xml

      - name: 发布 Release (prerelease)
        if: success() && env.IS_PRERELEASE == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          prerelease: true
          body_path: changelog.md
          files: ./updates/*.dmg

      - name: 发布 Release
        if: success() && env.IS_PRERELEASE == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          prerelease: false
          body_path: changelog.md
          files: |
            ./updates/*.dmg
            ./appcast.xml
            ./appcast-arm64.xml
            ./appcast-x86_64.xml

      - name: Upload to R2
        if: success()
        env:
          WEBHOOK_SECRET: ${{ secrets.COFFIC_APP_UPLOAD_KEY }}
        run: |
          set -euo pipefail
          upload_file() {
            local file="$1"
            local key="$2"
            local response
            echo "📤 Uploading to R2: $key"
            response=$(curl -s -X POST "${R2_API_URL}/lumi/upload" \
              -H "X-Webhook-Secret: ${WEBHOOK_SECRET}" \
              -F "file=@${file}" \
              -F "key=${key}")
            echo "Response: $response"
            echo "$response" | grep -q '"success":true'
          }

          shopt -s nullglob
          for dmg in ./updates/*.dmg; do
            upload_file "$dmg" "gitok/$(basename "$dmg")" || {
              echo "❌ Failed to upload $(basename "$dmg")"
              exit 1
            }
            echo "✅ $(basename "$dmg") uploaded"
          done

          if [ "${IS_PRERELEASE}" = "false" ]; then
            for appcast in appcast.xml appcast-arm64.xml appcast-x86_64.xml; do
              if [ ! -f "$appcast" ]; then
                echo "⚠️  $appcast not found, skipping"
                continue
              fi
              if upload_file "$appcast" "gitok/${appcast}"; then
                echo "✅ $appcast uploaded"
              else
                echo "❌ Failed to upload $appcast"
              fi
            done
          fi
