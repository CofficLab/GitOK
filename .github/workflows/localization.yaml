name: Localization

on:
  pull_request:
  push:
    branches:
      - dev
      - pre
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check localization catalogs
        run: python3 Scripts/check_localization.py
